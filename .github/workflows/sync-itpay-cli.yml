name: Sync ItPay CLI bundle

# Manual only: explain the need and obtain user approval before each Actions run.
on:
  workflow_dispatch:
    inputs:
      approval_reason:
        description: User-approved reason for this exact run (include approval reference)
        required: true
        type: string

jobs:
  sync:
    uses: itpay-ai/cli/.github/workflows/sync-platform-bundle.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      npm-channel: latest
      bundle-format: npm-tree
      version-files: package.json,.codex-plugin/plugin.json
    secrets:
      ITPAY_BUNDLE_APP_ID: ${{ secrets.ITPAY_BUNDLE_APP_ID }}
      ITPAY_BUNDLE_APP_PRIVATE_KEY: ${{ secrets.ITPAY_BUNDLE_APP_PRIVATE_KEY }}
